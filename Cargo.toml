[workspace]
members = ["crates/mirah-bidi", "crates/mirah-term", "crates/mirah"]
resolver = "3"
exclude = ["research"]

[workspace.package]
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Khaymah/mirah"

[workspace.dependencies]
mirah-bidi = { path = "crates/mirah-bidi" }
mirah-term = { path = "crates/mirah-term" }
compact_str = "0.10"
semver = "1"
sha2 = "0.11"
toml_edit = "0.25"
anyhow = "1"
criterion = { version = "0.5", default-features = false }
crossterm = "0.29"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
signal-hook = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
unicode-bidi = "0.3"
unicode-width = "0.2"
vt100 = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
